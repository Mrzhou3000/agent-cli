[project]
name = "agent-harness-cli"
version = "0.2.0"
description = "轻量级个人助手 Agent CLI — 集三大开源项目设计思想之大成的融合实现"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Mrzhou3000", email = "mrzhou3000@users.noreply.github.com" },
]
keywords = [
    "agent", "cli", "ai", "llm", "claude", "anthropic",
    "automation", "assistant", "terminal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Mrzhou3000/agent-cli"
Repository = "https://github.com/Mrzhou3000/agent-cli"
Documentation = "https://github.com/Mrzhou3000/agent-cli#readme"

[project.scripts]
agent-cli = "agent_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "vcrpy>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# 渐进式严格 — 先覆盖核心模块
[[tool.mypy.overrides]]
module = ["agent_cli.core.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["agent_cli.tools.base"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
