[project]
name = "agent-cli"
version = "0.1.0"
description = "轻量级个人助手 Agent CLI — 集三大开源项目设计思想之大成的融合实现"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[project.scripts]
agent-cli = "agent_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
