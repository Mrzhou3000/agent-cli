# =============================================================================
# pre-commit 本地钩子配置
#
# 功能：在 `git commit` 之前自动运行代码检查
#       如果检查不通过，commit 会被阻止
# 价值：在代码到达 GitHub 之前就发现问题，不用等 CI 报错
#
# 安装方法：
#   1. 安装 pre-commit: pip install pre-commit
#   2. 安装钩子:      pre-commit install
#   3. 手动运行:      pre-commit run --all-files
#
# 前置条件：
#   Python 3.12+
#   pre-commit: pip install pre-commit 或 uv pip install pre-commit
# =============================================================================

repos:
  # ── 通用检查 ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # 检查是否有合并冲突标记（<<<<<<<, =======, >>>>>>>）
      - id: check-merge-conflict
      # 检查 YAML 文件语法是否正确
      - id: check-yaml
      # 检查 JSON 文件语法是否正确
      - id: check-json
      # 检查文件末尾是否有多余的空行
      - id: trailing-whitespace
      # 检查文件末尾是否有且仅有一个换行符
      - id: end-of-file-fixer

  # ── Ruff（代码风格 + 格式化） ─────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      # ruff check: 代码质量检查（lint）
      - id: ruff
        args: [--fix]   # 能自动修的顺手修掉
      # ruff format: 代码格式化
      - id: ruff-format

  # ── pytest: 测试 ──────────────────────────────────────────
  # 确保所有测试通过后才允许提交
  # 与 CI 使用相同的命令，前置发现问题
  - repo: local
    hooks:
      - id: pytest
        name: 🧪 pytest
        description: "运行所有测试，阻止提交失败的测试"
        entry: uv run pytest tests/ -x --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        # 超时 120 秒——本地通常比 CI 快
        args: []

  # ── mypy: 类型检查 ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--no-strict-optional, --ignore-missing-imports, --python-version=3.12, src/agent_cli/]
        additional_dependencies: ['types-requests']
        pass_filenames: false  # 使用固定路径而非单个文件
